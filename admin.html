<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Florris Admin</title>
<style>
:root{--bg:#f6f7f4;--panel:#fff;--ink:#1d2a24;--mute:#6b7a72;--line:#dde3de;--accent:#2f6b4f;--danger:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--panel:#1c2420;--ink:#e8eee9;--mute:#93a49a;--line:#2b362f;--accent:#5fb589;--danger:#e0705e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}
main{max-width:1000px;margin:0 auto;padding:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
input,select,textarea{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:13px;color:var(--mute);font-weight:600}
td img{width:44px;height:44px;object-fit:cover;border-radius:4px;background:var(--line)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
#status{font-size:13px;color:var(--mute)}
#status.err{color:var(--danger)}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Florris Admin</h1>
  <span id="status">Not connected</span>
</header>
<main>

<section class="panel" id="connect">
  <h2>Connect to your repository</h2>
  <div class="grid">
    <label>GitHub username<input id="owner" placeholder="your-username"></label>
    <label>Repository name<input id="repo" placeholder="florris-professional-store"></label>
    <label>Branch<input id="branch" value="main"></label>
    <label>Access token<input id="token" type="password" placeholder="github_pat_..."></label>
  </div>
  <div class="row">
    <button class="primary" id="connectBtn">Connect and load products</button>
    <span style="font-size:13px;color:var(--mute)">Saved in this browser only. Token needs "Contents: read and write" on this repo.</span>
  </div>
</section>

<section class="panel hidden" id="editor">
  <h2 id="formTitle">Add product</h2>
  <div class="grid">
    <label>Name<input id="f_name"></label>
    <label>Price<input id="f_price" type="number" min="0" step="0.01"></label>
    <label>Category<input id="f_category" list="cats"></label>
    <label>Stock<input id="f_stock" type="number" min="0" step="1"></label>
  </div>
  <datalist id="cats"></datalist>
  <label>Description<textarea id="f_desc"></textarea></label>
  <div class="grid">
    <label>Image URL or path<input id="f_image" placeholder="images/photo.jpg"></label>
    <label>Upload image<input id="f_file" type="file" accept="image/*"></label>
    <label>Visibility
      <select id="f_visible"><option value="true">Shown in store</option><option value="false">Hidden</option></select>
    </label>
  </div>
  <div class="row">
    <button class="primary" id="saveBtn">Save product</button>
    <button id="cancelBtn">Clear form</button>
  </div>
</section>

<section class="panel hidden" id="listing">
  <h2>Products <span class="badge" id="count">0</span></h2>
  <div class="tablewrap">
    <table>
      <thead><tr><th></th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p id="empty" class="hidden" style="color:var(--mute)">No products yet. Add your first product above.</p>
</section>

</main>
<script>
const $ = id => document.getElementById(id);
const FILE = 'products.json';
let products = [], sha = null, editingId = null;

// ---- helpers
const enc = s => btoa(unescape(encodeURIComponent(s)));
const dec = b => decodeURIComponent(escape(atob(b.replace(/\n/g, ''))));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(msg, err){ const s = $('status'); s.textContent = msg; s.className = err ? 'err' : ''; }
function cfg(){ return {owner:$('owner').value.trim(), repo:$('repo').value.trim(), branch:$('branch').value.trim()||'main', token:$('token').value.trim()}; }
function api(path, opts = {}){
  const c = cfg();
  return fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${path}`, {
    ...opts,
    headers: {Authorization:`Bearer ${c.token}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json'}
  });
}

// ---- remember settings (this browser only)
try {
  const saved = JSON.parse(localStorage.getItem('florris_admin') || '{}');
  for (const k of ['owner','repo','branch','token']) if (saved[k]) $(k).value = saved[k];
} catch(e){}

// ---- load / save
async function load(){
  status('Loading...');
  const c = cfg();
  const r = await api(`${FILE}?ref=${encodeURIComponent(c.branch)}`);
  if (r.status === 404){ products = []; sha = null; }
  else if (!r.ok){ throw new Error(r.status === 401 ? 'Token rejected. Check the token and its permissions.' : `GitHub error ${r.status}`); }
  else { const j = await r.json(); sha = j.sha; products = JSON.parse(dec(j.content)).products || []; }
  try { localStorage.setItem('florris_admin', JSON.stringify(c)); } catch(e){}
  ['editor','listing'].forEach(i => $(i).classList.remove('hidden'));
  render(); status(`Connected to ${c.owner}/${c.repo}`);
}

async function commit(message){
  const c = cfg();
  const body = {message, branch:c.branch, content: enc(JSON.stringify({products}, null, 2))};
  if (sha) body.sha = sha;
  const r = await api(FILE, {method:'PUT', body:JSON.stringify(body)});
  if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.message || `Save failed (${r.status})`); }
  sha = (await r.json()).content.sha;
}

async function uploadImage(file){
  const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result.split(',')[1]); fr.onerror = rej; fr.readAsDataURL(file); });
  const path = `images/${Date.now()}-${file.name.replace(/[^\w.\-]/g,'_')}`;
  const r = await api(path, {method:'PUT', body:JSON.stringify({message:`Admin: upload ${path}`, branch:cfg().branch, content:b64})});
  if (!r.ok) throw new Error('Image upload failed');
  return path;
}

// ---- UI
function render(){
  $('count').textContent = products.length;
  $('empty').classList.toggle('hidden', products.length > 0);
  $('rows').innerHTML = products.map(p => `
    <tr>
      <td>${p.image ? `<img src="${esc(p.image)}" alt="">` : '<img alt="">'}</td>
      <td>${esc(p.name)}</td><td>${esc(p.category)}</td>
      <td>${Number(p.price).toFixed(2)}</td><td>${p.stock ?? 0}</td>
      <td><span class="badge">${p.visible ? 'Shown' : 'Hidden'}</span></td>
      <td class="row"><button data-edit="${p.id}">Edit</button><button class="danger" data-del="${p.id}">Delete</button></td>
    </tr>`).join('');
  $('cats').innerHTML = [...new Set(products.map(p => p.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('');
}

function clearForm(){
  editingId = null; $('formTitle').textContent = 'Add product';
  ['f_name','f_price','f_category','f_stock','f_desc','f_image'].forEach(i => $(i).value = '');
  $('f_file').value = ''; $('f_visible').value = 'true';
}

$('connectBtn').onclick = () => load().catch(e => status(e.message, true));
$('cancelBtn').onclick = clearForm;

$('saveBtn').onclick = async () => {
  const name = $('f_name').value.trim();
  if (!name) return status('Enter a product name.', true);
  const btn = $('saveBtn'); btn.disabled = true;
  try {
    status('Saving...');
    let image = $('f_image').value.trim();
    const file = $('f_file').files[0];
    if (file) image = await uploadImage(file);
    const item = {
      id: editingId || 'p' + Date.now(), name, image,
      price: parseFloat($('f_price').value) || 0,
      category: $('f_category').value.trim(),
      stock: parseInt($('f_stock').value) || 0,
      description: $('f_desc').value.trim(),
      visible: $('f_visible').value === 'true'
    };
    const i = products.findIndex(p => p.id === item.id);
    if (i >= 0) products[i] = item; else products.push(item);
    await commit(`Admin: ${editingId ? 'update' : 'add'} ${name}`);
    clearForm(); render(); status('Saved. The store updates in about a minute.');
  } catch(e){ status(e.message, true); }
  btn.disabled = false;
};

$('rows').onclick = async e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed){
    const p = products.find(x => x.id === ed); editingId = p.id;
    $('formTitle').textContent = 'Edit product';
    $('f_name').value = p.name; $('f_price').value = p.price; $('f_category').value = p.category || '';
    $('f_stock').value = p.stock ?? 0; $('f_desc').value = p.description || ''; $('f_image').value = p.image || '';
    $('f_visible').value = String(!!p.visible);
    window.scrollTo({top:0, behavior:'smooth'});
  }
  if (del){
    const p = products.find(x => x.id === del);
    if (!confirm(`Delete "${p.name}"?`)) return;
    try {
      products = products.filter(x => x.id !== del);
      await commit(`Admin: delete ${p.name}`);
      render(); status('Deleted. The store updates in about a minute.');
    } catch(err){ status(err.message, true); await load(); }
  }
};
</script>
</body>
</html>
